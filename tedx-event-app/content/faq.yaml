# ============================================================
# よくある質問（AIコンシェルジュの回答のもと）
# ============================================================
# 来場者がAIに質問したとき、ここに書いた内容をもとに答えます。
# AIに知っておいてほしい当日の情報（クローク、撮影ルールなど）はここに足してください。
# 
#   質問       : よく聞かれそうな聞き方で
#   答え       : 正確に。時間や場所はほかのファイルと食い違わないように
#   キーワード : 来場者が使いそうな言葉（APIキー未設定時の簡易応答で使います）。省略可

よくある質問:

  - 質問: 受付は何時からですか？
    答え: 受付（ロビー）は9:30開始です。チケットのQRコードを受付スタッフに提示してください。
    キーワード: [受付, 開場, 何時, チェックイン, 入場]

  - 質問: Wi-Fiはありますか？
    答え: 会場Wi-Fi「TEDxQuestgrow-Guest」が利用できます。パスワードはロビーの掲示とアプリのお知らせに記載しています。
    キーワード: [wifi, wi-fi, ワイファイ, インターネット, ネット]

  - 質問: 昼食はどうすればいいですか？
    答え: フードコートで軽食・ドリンクを販売しています（キャッシュレスのみ）。13:30〜14:40はラウンジでランチ・ミートアップもあります（要予約）。
    キーワード: [昼食, ランチ, ご飯, 食事, フード, お腹]

  - 質問: 荷物を預けられますか？
    答え: ロビーのクロークで手荷物をお預かりします（無料・18:45まで）。貴重品はご自身で管理してください。
    キーワード: [荷物, クローク, 預け, コート, ロッカー]

  - 質問: 途中入退場はできますか？
    答え: メインホールはトークの合間（拍手の後）に入退場できます。トーク中の入場はスタッフがご案内します。
    キーワード: [途中, 入退場, 遅刻, 遅れ, 退場]

  - 質問: 車椅子でも参加できますか？
    答え: 全エリア段差なしで移動できるルートがあります。マップの「段差を避ける」をオンにすると車椅子対応ルートを表示します。多目的トイレはトイレエリアにあります。
    キーワード: [車椅子, バリアフリー, 段差, エレベーター, 多目的]

  - 質問: 撮影してもいいですか？
    答え: トーク中のフラッシュ撮影・動画撮影はご遠慮ください。写真撮影（フラッシュなし）は可能です。トークは後日TEDxの公式チャンネルで公開されます。
    キーワード: [撮影, 写真, 動画, カメラ, 録画]

  - 質問: 体調が悪くなったら？
    答え: ロビー右手の救護室（看護師常駐）へお越しください。近くのスタッフに声をかけていただいても対応します。
    キーワード: [体調, 気分, 救護, 具合, けが, 怪我, 医務]

  - 質問: 落とし物をしました
    答え: ロビーのインフォメーションで落とし物をお預かりしています。アプリの「スタッフに問い合わせ」からも連絡できます。
    キーワード: [落とし物, 忘れ物, なくした, 紛失, 失くし]

  - 質問: 予約していないセッションに参加できますか？
    答え: 空席があれば参加できます。満席の場合はキャンセル待ちに登録すると、空きが出た時に自動で繰り上がります。
    キーワード: [予約, 当日, 空き, キャンセル待ち, 満席, 参加]
