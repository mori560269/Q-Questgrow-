# ============================================================
# 会場マップ（エリアの名前・説明と、展示ブース）
# ============================================================
# アプリの「マップ」タブ、プログラムの会場名、AIの道案内に使われます。
# 
#   ID   : 地図上の位置と結びついています。変更・追加・削除はしないでください。
#          （エリアの形や通路を変えたいときは開発担当に相談してください）
#   名前 : 表示名。programs.yaml の「会場」にはこの名前をそのまま書きます
#   説明 : エリアをタップしたときの説明。AIもこの文を使って案内します

# --- エリア ---
エリア:

  - ID: main
    名前: メインホール
    説明: トークセッション会場。座席は自由席（予約者優先エリアあり）。

  - ID: studioA
    名前: スタジオA
    説明: ワークショップ会場（定員30名）。

  - ID: studioB
    名前: スタジオB
    説明: ワークショップ会場（定員20名）。

  - ID: lounge
    名前: ラウンジ
    説明: 交流会・ランチ・Q&Aラウンジ。

  - ID: booths
    名前: 展示ブース
    説明: パートナー企業・団体の展示（B1〜B6）。

  - ID: food
    名前: フードコート
    説明: 軽食・ドリンク。キャッシュレスのみ。

  - ID: lobby
    名前: ロビー / 受付
    説明: 受付・チェックイン・インフォメーション・クローク。

  - ID: wc
    名前: トイレ（多目的あり）
    説明: 多目的トイレ・授乳室あり。

  - ID: first_aid
    名前: 救護室
    説明: 体調不良の際はこちらへ。看護師常駐。

# --- 展示ブース（マップ中央の B1〜B6 の枠。最大6つ） ---
#   番号: B1〜B6 のどれか / 名前: 表示名
ブース:
  - 番号: B1
    名前: 海洋ロボット展示
  - 番号: B2
    名前: アップサイクル雑貨
  - 番号: B3
    名前: AI 似顔絵ブース
  - 番号: B4
    名前: 地域の空き家マップ
  - 番号: B5
    名前: 屋上ファームの野菜
  - 番号: B6
    名前: TEDx メッセージウォール
