# ============================================================
# プログラム（タイムテーブル）
# ============================================================
# アプリの「プログラム」タブ・ホームの「このあと」・マイプラン・AIの案内に使われます。
# 
# ▼ 1つのプログラムの書き方（「- ID:」から次の「- ID:」の手前までが1つ分）
#   ID       : 英数字の短い名前（例: s6, w5）。ほかと重ならないこと。
#              ※ 公開後に変えると、その回の予約が消えたように見えるので変えない。
#   タイトル : 表示される名前
#   種類     : トーク / ワークショップ / ツアー / 交流会 / パフォーマンス のどれか
#   開始・終了: "10:20" のように、ダブルクォート付きで24時間表記
#   会場     : venue.yaml の「名前」と同じ文字（例: メインホール, スタジオA）
#   登壇者   : speakers.yaml の「名前」と同じ文字。いなければ []
#   定員     : 人数（数字）
#   予約     : 必要 / 不要
#   タグ     : 検索やAIのおすすめに使うキーワード。[音楽, アート] のように書く
#   説明     : 紹介文。複数行にしたいときは「説明: |」と書いて次の行から字下げする
# 
# ▼ 追加したいとき：いちばん下の1件をまるごとコピーして貼り付け、中身を書き換える
# ▼ 消したいとき　：その1件（- ID: から次の - ID: の手前まで）を削除する
# ▼ 字下げ（行頭のスペース）はそろえてください。タブ文字は使えません。

