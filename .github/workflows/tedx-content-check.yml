# tedx-event-app の掲載情報（content フォルダ）を、編集のたびに自動でチェックする
name: 掲載情報のチェック

on:
  pull_request:
    paths: ["tedx-event-app/**", ".github/workflows/tedx-content-check.yml"]
  push:
    paths: ["tedx-event-app/**", ".github/workflows/tedx-content-check.yml"]

jobs:
  check:
    name: 掲載情報とアプリのチェック
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tedx-event-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tedx-event-app/package-lock.json
      - run: npm ci
      - name: 掲載情報の書き方をチェック
        run: npm run content
      - name: アプリの型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test
