<title>Phase 2 実データの結果</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* layout: 1 本の読み物の列（最大 880px）。地図と図は列いっぱい、表は横スクロール。災害対応の報告書らしく、地図の紙色と信号色だけで組む */
:root {
  --paper: #f5f7f6;      /* 地図の紙 */
  --panel: #ffffff;
  --ink: #16232a;        /* スレート */
  --muted: #55636a;
  --rule: #d5dcda;
  --signal: #c2410c;     /* 通信断・注意 */
  --classic: #eb6834;    /* 古典 */
  --qubo: #2a78d6;       /* QUBO */
  --exact: #16232a;      /* 厳密解・基準 */
  --old: #a3adb1;        /* 以前の QUBO（比較の基準） */
  --ms: #6250d6;         /* 目的: 最後の回復時刻 */
  --sum: #1baf7a;        /* 目的: 回復時刻の合計 */
  --best-bg: #e6f2ec;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12191c; --panel: #1a2327; --ink: #e6ecea; --muted: #a7b3b1; --rule: #2f3b40;
    --signal: #f08a4b; --classic: #d95926; --qubo: #3987e5; --exact: #e6ecea; --old: #66737a;
    --ms: #9085e9; --sum: #199e70; --best-bg: #1d3329; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12191c; --panel: #1a2327; --ink: #e6ecea; --muted: #a7b3b1; --rule: #2f3b40;
  --signal: #f08a4b; --classic: #d95926; --qubo: #3987e5; --exact: #e6ecea; --old: #66737a;
  --ms: #9085e9; --sum: #199e70; --best-bg: #1d3329; color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.8; }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 40px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 56px; }
header { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(30px, 5vw, 44px); line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.35; margin: 0; text-wrap: balance; }
h3 { font-size: 17px; margin: 0; }
p { margin: 0; max-width: 40em; }
section { display: flex; flex-direction: column; gap: 18px; }
.note { border: 1px solid var(--signal); color: var(--ink); background: var(--panel); border-radius: 6px; padding: 12px 16px; font-size: 14px; }
.note b { color: var(--signal); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.facts div { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.facts b { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.facts span { font-size: 13px; color: var(--muted); }
ol.findings { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; max-width: 42em; }
figure { margin: 0; display: flex; flex-direction: column; gap: 10px; }
figure img { width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 6px; background: #fff; }
.cap, figcaption { font-size: 13px; color: var(--muted); max-width: 52em; }
.chart { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px; overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 620px; height: auto; font-family: var(--f-body); }
.grid { stroke: var(--rule); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lab { fill: var(--ink); font-size: 13px; }
.val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.val.small { font-size: 12px; }
.refl { fill: var(--muted); font-size: 12px; }
.ref-opt { stroke: var(--exact); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ref-lb { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.ln { fill: none; stroke-width: 2; } .ln.classic { stroke: var(--classic); } .ln.hybrid { stroke: var(--sum); } .ln.qubo { stroke: var(--qubo); } .ln.old { stroke: var(--old); }
.pt { stroke: var(--panel); stroke-width: 2; } .pt.classic { fill: var(--classic); } .pt.hybrid { fill: var(--sum); } .pt.qubo { fill: var(--qubo); } .pt.old { fill: var(--old); }
.sw.hybrid { background: var(--sum); }
.err { stroke-width: 2; opacity: .55; } .err.classic { stroke: var(--classic); } .err.hybrid { stroke: var(--sum); } .err.qubo { stroke: var(--qubo); }
.band { stroke: none; opacity: .18; } .band.classic { fill: var(--classic); } .band.qubo { fill: var(--qubo); }
.bar.classic { fill: var(--classic); } .bar.qubo { fill: var(--qubo); } .bar.exact { fill: var(--exact); } .bar.old { fill: var(--old); }
.range { stroke-width: 2; } .range.ms { stroke: var(--ms); } .range.sum { stroke: var(--sum); } .range.exact { stroke: var(--exact); }
.dot { stroke: var(--panel); stroke-width: 2; } .dot.ms { fill: var(--ms); } .dot.sum { fill: var(--sum); } .dot.exact { fill: var(--exact); }
.worst.ms { fill: var(--ms); } .worst.sum { fill: var(--sum); } .worst.exact { fill: var(--exact); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sw.classic { background: var(--classic); } .sw.qubo { background: var(--qubo); } .sw.exact { background: var(--exact); }
.sw.old { background: var(--old); } .sw.ms { background: var(--ms); } .sw.sum { background: var(--sum); }
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: right; vertical-align: bottom; white-space: normal; min-width: 5.5em; }
tbody th { text-align: left; font-weight: 400; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
td small { display: block; font-size: 11px; color: var(--muted); }
td.best { background: var(--best-bg); font-weight: 700; }
td.na { color: var(--muted); }
td.lb { color: var(--muted); }
.formula { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.7; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > div { min-width: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
a { color: var(--qubo); }
footer { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
</style>
